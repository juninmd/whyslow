<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">whyslow — encontre a fase lenta</title>
  <desc id="desc">Diagnóstico HTTP por fase: DNS, TCP, TLS, TTFB e download. CLI e biblioteca TypeScript.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2b"/><stop offset="1" stop-color="#172535"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <path d="M800 0L480 320M1000 0L680 320M1200 0L880 320" stroke="#ffffff" stroke-opacity=".035" stroke-width="80"/>
  <rect x="46" y="40" width="88" height="27" rx="7" fill="#fbbf24" fill-opacity=".14"/>
  <text x="90" y="59" fill="#fcd34d" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">HTTP / 1.1</text>
  <text x="46" y="138" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-3">why<tspan fill="#fbbf24">slow</tspan><tspan fill="#64748b">?</tspan></text>
  <text x="48" y="177" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="22">“Está lento” é o começo da investigação.</text>
  <text x="48" y="207" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="18">Veja onde o tempo vai. Saiba por onde começar.</text>
  <g font-family="Consolas,monospace" font-size="15">
    <rect x="48" y="252" width="740" height="7" rx="3.5" fill="#334155"/>
    <rect x="48" y="252" width="65" height="7" rx="3.5" fill="#67e8f9"/>
    <rect x="119" y="252" width="106" height="7" rx="3.5" fill="#38bdf8"/>
    <rect x="231" y="252" width="143" height="7" rx="3.5" fill="#a78bfa"/>
    <rect x="380" y="252" width="271" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="48" y="285" fill="#67e8f9">DNS</text><text x="119" y="285" fill="#38bdf8">TCP</text>
    <text x="231" y="285" fill="#a78bfa">TLS</text><text x="380" y="285" fill="#fbbf24">TTFB</text>
    <text x="669" y="285" fill="#94a3b8">download</text>
  </g>
  <g font-family="Consolas,monospace" font-size="16">
    <rect x="857" y="77" width="296" height="163" rx="12" fill="#0b1220" stroke="#334155"/>
    <circle cx="877" cy="97" r="4" fill="#fb7185"/><circle cx="892" cy="97" r="4" fill="#fbbf24"/><circle cx="907" cy="97" r="4" fill="#34d399"/>
    <text x="878" y="136" fill="#94a3b8">$ <tspan fill="#f8fafc">whyslow sua-api.dev</tspan></text>
    <text x="878" y="176" fill="#67e8f9">CLI <tspan fill="#64748b">+</tspan><tspan fill="#c4b5fd"> TypeScript API</tspan></text>
    <text x="878" y="209" fill="#94a3b8">medir → analisar → agir</text>
  </g>
</svg>
