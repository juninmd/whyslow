name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para publicar/repetir no npm (vX.Y.Z); vazio atualiza o PR de release'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # PRs criados pelo GITHUB_TOKEN não disparam pull_request. Dispatch é permitido.
      - name: Run CI on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RELEASE_PR" | jq -er '.headBranchName')
          gh workflow run ci.yml --ref "$branch"
      - name: Report npm setup status
        if: steps.release.outputs.release_created == 'true' && vars.NPM_PUBLISH_ENABLED != 'true'
        run: echo 'GitHub release criada. Publicação npm desativada até configurar Trusted Publishing e NPM_PUBLISH_ENABLED.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [validate, release]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' && vars.NPM_PUBLISH_ENABLED == 'true' &&
      (needs.release.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == false'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version and main ancestry
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal('v' + JSON.parse(fs.readFileSync('package.json', 'utf8')).version, process.env.RELEASE_TAG);"
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: npm run test:package
      - name: Publish with npm Trusted Publishing (OIDC)
        run: npm publish --access public
